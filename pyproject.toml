[tool.poetry]
name = "toxicitylimitations"
version = "0.1.0"
description = "code used for the paper about the limitations of toxicity detection systems"
authors = ["TheophileBERTELOOT <thber64@ulaval.ca>"]
license = "MIT"
readme = "README.md"
packages = [{include = "ToxicityLimitations"}]


[tool.poetry.scripts]
main = "ToxicityLimitations.main:cli"
dlModels = "ToxicityLimitations.dlModels:cli"

[tool.poetry.dependencies]
python = ">=3.13"
click = "^8.1.7"
transformers = "^4.46.0"
torch = "^2.5.0"
datasets = "^3.0.2"
accelerate = "^1.1.1"
scikit-learn = "^1.6.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
